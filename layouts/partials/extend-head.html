<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Inter + Fraunces fonts (non-render-blocking) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>

<!-- AI Context Files for LLMs -->
<link rel="llms" href="/llms.txt" type="text/plain" title="LLM Context">
<link rel="llms-full" href="/llms-full.txt" type="text/plain" title="LLM Full Context">

<!-- Meta description (Congo doesn't emit this) -->
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">

<!-- AI Crawler Optimization -->
<meta name="ai-content-declaration" content="human-written, fact-checked, regularly-updated">

<!-- Organization Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "GLP-1 for Wellness",
  "url": "https://glp1forwellness.com",
  "description": "Independent, evidence-based guides on how GLP-1 medications affect health conditions beyond weight loss, with affordable telehealth options."

</script>

{

</script>

<!-- AI Referral Tracking -->
{{ if hugo.IsProduction }}
<script>
(function() {
  var defined_sources = [
    { domain: 'chatgpt.com', name: 'ChatGPT' },
    { domain: 'chat.openai.com', name: 'ChatGPT' },
    { domain: 'perplexity.ai', name: 'Perplexity' },
    { domain: 'claude.ai', name: 'Claude' },
    { domain: 'you.com', name: 'You.com' },
    { domain: 'copilot.microsoft.com', name: 'Copilot' },
    { domain: 'gemini.google.com', name: 'Gemini' },
    { domain: 'phind.com', name: 'Phind' },
    { domain: 'bing.com/chat', name: 'Bing Chat' }
  ];
  try {
    var ref = document.referrer;
    if (!ref) return;
    for (var i = 0; i < defined_sources.length; i++) {
      if (ref.indexOf(defined_sources[i].domain) !== -1) {
        if (typeof gtag === 'function') {
          gtag('event', 'ai_referral', { ai_source: defined_sources[i].name });
        }
        break;
      }
    }
  } catch(e) {}
})();
</script>
{{ end }}

<!-- Prevent search form submit on Enter -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  var form = document.querySelector('#search-modal form');
  if (form) form.addEventListener('submit', function(e) { e.preventDefault(); });
});
</script>

{{ if .IsPage }}
<!-- Speakable Schema for AEO -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": {{ .Title | jsonify }},
  "url": {{ .Permalink | jsonify }},
  "speakable": {
    "@type": "SpeakableSpecification",
    "cssSelector": ["h1", ".tldr-box"]
  }
}
</script>
{{ end }}
